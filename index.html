",right:"Empat warna, dua pasang komplementer"}],pembahasan:"Setiap skema adalah pola posisi pada roda warna. Bukan hasil mencampur warna, melainkan hubungan letaknya."},{id:"harmoni-6",kategori:"harmoni",type:"pg",materi:"campur",soal:"Komplementer biru adalah oranye pada roda RYB, tetapi kuning pada roda RGB. Mengapa?",options:["Salah satu roda keliru","Kedua roda disusun dari warna primer yang berbeda","Kode HEX berbeda di tiap perangkat","Pengaruh white balance kamera"],answer:1,pembahasan:"Roda RYB berpusat pada primer pigmen (merah, kuning, biru), roda RGB pada primer cahaya (merah, hijau, biru). Posisi warna pada kedua roda berbeda, sehingga lawannya pun berbeda. Keduanya benar untuk medianya masing-masing."},{id:"foto-1",kategori:"foto",type:"pg",materi:"suasana",soal:"Fotografer memotret di bawah lampu pijar (\xB13200 K), tetapi white balance kamera diatur 5500 K. Hasil fotonya akan tampak\u2026",options:["Kebiruan","Oranye kekuningan","Kehijauan","Netral"],answer:1,pembahasan:"Kamera mengira cahaya adalah cahaya siang (5500 K), padahal lampunya lebih hangat (3200 K). Kehangatan itu tidak dikoreksi sehingga foto tampak oranye kekuningan."},{id:"foto-2",kategori:"foto",type:"pg",materi:"suasana",soal:"Untuk foto iklan minuman dingin yang ingin terasa segar, warna latar yang paling tepat adalah\u2026",options:["Oranye terbakar","Merah tua","Biru toska","Cokelat"],answer:2,pembahasan:"Warna sejuk seperti biru dan toska diasosiasikan dengan air, es, dan kesegaran. Merah, oranye, dan cokelat memberi kesan hangat."},{id:"foto-3",kategori:"foto",type:"pg",materi:"suasana",soal:"Lampu rim (rim light) terutama berfungsi untuk\u2026",options:["Menerangi latar","Memberi garis cahaya di tepi subjek sehingga terpisah dari latar","Menghilangkan bayangan di wajah","Mengatur white balance"],answer:1,pembahasan:"Lampu rim diletakkan di belakang subjek. Cahayanya membentuk garis terang di tepi subjek sehingga subjek terpisah dari latar, terutama pada latar gelap."},{id:"foto-4",kategori:"foto",type:"pg",materi:"suasana",soal:"Foto produk untuk katalog toko daring sebaiknya memakai\u2026",options:["Gel warna mencolok agar menarik","White balance yang sama dengan suhu lampu dan latar netral","Latar komplementer yang sangat jenuh","Lampu sangat hangat 2500 K"],answer:1,pembahasan:"Tujuan foto katalog adalah warna yang akurat. White balance yang sesuai suhu lampu menghilangkan color cast, dan latar netral tidak memantulkan warna ke produk."},{id:"foto-5",kategori:"foto",type:"roda",wheel:"RYB",materi:"suasana",target:240,tolerance:15,soal:"Sepatu oranye akan difoto dengan latar komplementer. Klik warna latar yang tepat pada roda RYB.",check:a=>a.wrap(240),pembahasan:"Oranye berada di 60\xB0 roda RYB. Komplementernya 240\xB0, yaitu biru. Latar biru membuat sepatu oranye sangat menonjol."},{id:"foto-6",kategori:"foto",type:"pg",materi:"suasana",soal:"Foto low-key dengan latar gelap dan cahaya dramatis umumnya memberi kesan\u2026",options:["Ceria dan ringan","Misterius dan dramatis","Bersih dan steril","Netral dan akurat"],answer:1,pembahasan:"Low-key didominasi area gelap dengan sedikit bagian terang. Kesannya misterius, tegang, atau dramatis, sering dipakai di poster film."}]});var Or,gn,Br=ze(()=>{Or=["hsv","tingkat","campur","kode","suasana"],gn=[{id:"hsv",no:1,judul:"Hue, saturation, value",ringkas:"Tiga ukuran untuk menjelaskan warna apa pun.",isi:`
      <p>Setiap warna dapat dijelaskan dengan tiga pertanyaan. Aplikasi desain dan kamera memakai tiga ukuran ini, yang disingkat <strong>HSV</strong>.</p>
      <dl class="terms">
        <dt>Hue (H)</dt><dd>Jenis warna: merah, kuning, hijau, biru, dan seterusnya. Hue ditulis dalam derajat 0\xB0\u2013360\xB0 karena warna disusun melingkar. Merah 0\xB0, kuning 60\xB0, hijau 120\xB0, cyan 180\xB0, biru 240\xB0, magenta 300\xB0.</dd>
        <dt>Saturation (S)</dt><dd>Kejenuhan atau kemurnian warna, 0%\u2013100%. Saturasi 100% berarti warna paling "menyala". Semakin turun, warna makin kusam sampai menjadi abu-abu di 0%.</dd>
        <dt>Value (V)</dt><dd>Terang-gelap warna, 0%\u2013100%. Value 0% selalu hitam, berapa pun hue dan saturasinya.</dd>
      </dl>
      <h3>Tint, tone, dan shade</h3>
      <p>Dari satu hue kita dapat membuat banyak variasi:</p>
      <ul>
        <li><strong>Tint</strong> = warna + putih \u2192 lebih muda, pastel (saturasi turun, value naik).</li>
        <li><strong>Tone</strong> = warna + abu-abu \u2192 lebih kalem.</li>
        <li><strong>Shade</strong> = warna + hitam \u2192 lebih gelap (value turun).</li>
      </ul>
      <p class="callout">Dalam fotografi, value menentukan apakah subjek terpisah dari latar. Dua warna dengan hue berbeda tetapi value sama akan tampak menyatu jika foto diubah menjadi hitam-putih.</p>`,demo:"hsv",cek:[{soal:"Warna biru diturunkan saturasinya sampai 0%. Warna yang terlihat adalah\u2026",options:["Biru tua","Abu-abu","Hitam","Biru muda"],answer:1,pembahasan:"Saturasi 0% menghilangkan unsur warna sehingga yang tersisa hanya abu-abu dengan terang sesuai value."},{soal:"Shade dibuat dengan cara\u2026",options:["Menambahkan putih","Menambahkan hitam","Mengubah hue 180\xB0","Menaikkan saturasi"],answer:1,pembahasan:"Shade = warna + hitam, sehingga value-nya turun dan warna menjadi lebih gelap."}]},{id:"tingkat",no:2,judul:"Warna primer, sekunder, tersier",ringkas:"Susunan 12 warna pada roda warna, untuk pigmen dan untuk cahaya.",isi:`
      <p>Roda warna menyusun warna dalam lingkaran. Ada <strong>dua roda</strong> yang dipakai, sesuai medianya:</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Tingkat</th><th>Roda pigmen (RYB)<br><small>cat, seni rupa</small></th><th>Roda cahaya (RGB)<br><small>layar, lampu, kamera</small></th></tr></thead>
        <tbody>
          <tr><td>Primer</td><td>Merah, kuning, biru</td><td>Merah, hijau, biru</td></tr>
          <tr><td>Sekunder<br><small>primer + primer</small></td><td>Oranye, hijau, ungu</td><td>Kuning, cyan, magenta</td></tr>
          <tr><td>Tersier<br><small>primer + sekunder</small></td><td>Merah-oranye, kuning-oranye, kuning-hijau, biru-hijau, biru-ungu, merah-ungu</td><td>Oranye, chartreuse, spring green, azure, violet, rose</td></tr>
        </tbody>
      </table></div>
      <h3>Harmoni = posisi pada roda</h3>
      <p>Skema harmoni warna (komplementer, analog, triadik, tetradik, monokromatik, split komplementer) adalah <strong>pola posisi</strong> pada roda, bukan hasil mencampur warna. Karena susunan kedua roda berbeda, lawan sebuah warna juga bisa berbeda:</p>
      <ul>
        <li>Komplementer <strong>merah</strong>: hijau pada roda RYB, cyan pada roda RGB.</li>
        <li>Komplementer <strong>biru</strong>: oranye pada roda RYB, kuning pada roda RGB.</li>
      </ul>
      <p class="callout">Gunakan roda RYB saat merencanakan warna properti, cat, dan busana di depan kamera. Gunakan roda RGB saat bekerja dengan lampu berwarna, layar, dan kode HEX.</p>`,demo:"tingkat",cek:[{soal:"Pada roda cahaya (RGB), merah + hijau menghasilkan warna sekunder\u2026",options:["Cokelat","Kuning","Oranye","Cyan"],answer:1,pembahasan:"Pada cahaya, merah + hijau = kuning. Ini sebabnya kuning adalah warna sekunder pada roda RGB."},{soal:"Merah-oranye termasuk warna\u2026",options:["Primer","Sekunder","Tersier","Netral"],answer:2,pembahasan:"Merah-oranye adalah tersier: campuran primer (merah) dan sekunder di sebelahnya (oranye)."}]},{id:"campur",no:3,judul:"Cahaya vs pigmen",ringkas:"Mengapa lampu dan cat bercampur dengan cara yang berlawanan.",isi:`
      <h3>Aditif: mencampur cahaya</h3>
      <p>Layar, proyektor, dan lampu studio <strong>memancarkan</strong> cahaya. Setiap cahaya menambah energi, sehingga campurannya makin terang:</p>
      <ul>
        <li>Merah + hijau = kuning</li>
        <li>Hijau + biru = cyan</li>
        <li>Biru + merah = magenta</li>
        <li>Merah + hijau + biru = putih</li>
      </ul>
      <h3>Subtraktif: mencampur tinta dan cat</h3>
      <p>Tinta dan cat <strong>menyerap</strong> sebagian cahaya putih dan memantulkan sisanya. Setiap tinta mengurangi cahaya yang dipantulkan, sehingga campurannya makin gelap:</p>
      <ul>
        <li>Cyan + magenta = biru</li>
        <li>Magenta + kuning = merah</li>
        <li>Kuning + cyan = hijau</li>
        <li>Cyan + magenta + kuning = hitam (secara teori; printer menambah tinta K agar hitamnya pekat)</li>
      </ul>
      <h3>Dampaknya dalam fotografi</h3>
      <p>Warna objek di foto adalah hasil <strong>warna permukaan \xD7 warna cahaya</strong>. Kaus merah di bawah lampu hijau murni tampak hampir hitam karena tidak ada cahaya merah yang dapat dipantulkan. Itulah sebabnya gel warna pada lampu studio sangat mengubah suasana foto.</p>`,demo:"campur",cek:[{soal:"Lampu biru dan lampu merah disorotkan ke dinding putih. Area tumpang tindihnya berwarna\u2026",options:["Ungu gelap","Magenta","Hitam","Hijau"],answer:1,pembahasan:"Pada cahaya (aditif), biru + merah = magenta yang terang, bukan ungu gelap seperti campuran cat."},{soal:"Tinta kuning dan cyan pada kertas putih menghasilkan\u2026",options:["Hijau","Putih","Merah","Biru"],answer:0,pembahasan:"Kuning menyerap biru, cyan menyerap merah. Cahaya yang tersisa dan dipantulkan adalah hijau."}]},{id:"kode",no:4,judul:"Kode warna HEX dan RGB",ringkas:"Cara komputer menuliskan warna dengan angka.",isi:`
      <p>Komputer menyimpan warna cahaya sebagai tiga angka: kekuatan <strong>merah (R), hijau (G), dan biru (B)</strong>, masing-masing 0\u2013255.</p>
      <ul>
        <li><code>rgb(255, 0, 0)</code> = merah penuh</li>
        <li><code>rgb(255, 255, 255)</code> = putih</li>
        <li><code>rgb(0, 0, 0)</code> = hitam</li>
      </ul>
      <h3>Kode HEX</h3>
      <p>HEX menulis angka yang sama dalam bilangan heksadesimal (0\u20139 lalu A\u2013F), dua digit per kanal: <code>#RRGGBB</code>.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>HEX</th><th>R</th><th>G</th><th>B</th><th>Warna</th></tr></thead>
        <tbody>
          <tr><td><code>#FF8000</code></td><td>FF = 255</td><td>80 = 128</td><td>00 = 0</td><td>Oranye</td></tr>
          <tr><td><code>#1F4E8C</code></td><td>1F = 31</td><td>4E = 78</td><td>8C = 140</td><td>Biru gelap</td></tr>
          <tr><td><code>#777777</code></td><td>77 = 119</td><td>77 = 119</td><td>77 = 119</td><td>Abu-abu</td></tr>
        </tbody>
      </table></div>
      <p>Cara menghitung: digit pertama \xD7 16 + digit kedua. Contoh <code>8C</code> = 8 \xD7 16 + 12 = 140 (C = 12).</p>
      <p class="callout">Saat menulis alasan pemilihan warna, cantumkan kode HEX agar warna yang kamu maksud tidak bisa salah ditafsirkan, misalnya "latar biru <code>#1F4E8C</code>".</p>`,demo:"kode",cek:[{soal:"Kode #00FF00 menunjukkan warna\u2026",options:["Merah","Hijau","Biru","Kuning"],answer:1,pembahasan:"R = 00, G = FF (255), B = 00. Hanya kanal hijau yang penuh, jadi warnanya hijau."},{soal:"Nilai desimal dari heksadesimal A0 adalah\u2026",options:["100","160","10","200"],answer:1,pembahasan:"A = 10, jadi A0 = 10 \xD7 16 + 0 = 160."}]},{id:"suasana",no:5,judul:"Warna dan suasana foto",ringkas:"Suhu warna, white balance, dan kesan yang dibangun warna.",isi:`
      <h3>Warna hangat dan sejuk</h3>
      <p><strong>Hangat</strong> (merah, oranye, kuning) terasa akrab, energik, dan menggugah selera, cocok untuk foto makanan dan suasana keluarga. <strong>Sejuk</strong> (hijau, biru, ungu) terasa segar, tenang, bersih, atau dingin, cocok untuk minuman dingin, teknologi, dan kesehatan.</p>
      <h3>Suhu warna cahaya (Kelvin)</h3>
      <p>Setiap sumber cahaya punya warna yang diukur dalam <strong>Kelvin (K)</strong>. Makin kecil angkanya, makin oranye cahayanya.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Sumber cahaya</th><th>Suhu warna</th></tr></thead>
        <tbody>
          <tr><td>Lilin</td><td>\xB1 1900 K</td></tr>
          <tr><td>Lampu pijar/tungsten</td><td>\xB1 2700\u20133200 K</td></tr>
          <tr><td>Cahaya siang, flash</td><td>\xB1 5500 K</td></tr>
          <tr><td>Langit mendung</td><td>\xB1 6500\u20137000 K</td></tr>
          <tr><td>Bayangan di hari cerah</td><td>\xB1 7500\u20139000 K</td></tr>
        </tbody>
      </table></div>
      <h3>White balance</h3>
      <p><strong>White balance (WB)</strong> pada kamera memberi tahu kamera warna cahaya yang dipakai, agar benda putih tetap tampak putih. Jika WB tidak sama dengan suhu lampu, foto mendapat <strong>color cast</strong>:</p>
      <ul>
        <li>WB lebih tinggi dari suhu lampu \u2192 foto kekuningan/oranye.</li>
        <li>WB lebih rendah dari suhu lampu \u2192 foto kebiruan.</li>
